[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taiji-sdk"
version = "0.1.0"
description = "Python client for natural-language analytics through independent MCP services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "mcp>=1.6,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "build>=1", "python-dotenv>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taiji = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
